<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420">
  <style>
    .title { font: 700 20px Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 13px Arial, sans-serif; fill: #334155; }
    .hdr { font: 700 12px Arial, sans-serif; fill: #0f172a; }
    .cell { font: 12px Arial, sans-serif; fill: #111827; }
    .note { font: 12px Arial, sans-serif; fill: #374151; }
  </style>

  <rect x="0" y="0" width="980" height="420" fill="#f8fafc" />
  <text x="24" y="32" class="title">Collapse vs Contamination Replication Matrix</text>
  <text x="24" y="52" class="subtitle">Route2 stress test: confidence-channel separation survives case/slice perturbation.</text>

  <rect x="24" y="72" width="932" height="34" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="38" y="94" class="hdr">Target</text>
  <text x="280" y="94" class="hdr">Expected Channel</text>
  <text x="430" y="94" class="hdr">Failure</text>
  <text x="520" y="94" class="hdr">Confidence Collapse</text>
  <text x="690" y="94" class="hdr">High-Confidence Wrong</text>
  <text x="870" y="94" class="hdr">Neither-Source</text>

  <rect x="24" y="106" width="932" height="52" fill="#fef2f2" stroke="#fecaca"/>
  <text x="38" y="136" class="cell">R1_FR02_case</text>
  <text x="280" y="136" class="cell">collapse_like</text>
  <text x="430" y="136" class="cell">0.336</text>
  <text x="560" y="136" class="cell">0.056</text>
  <text x="740" y="136" class="cell">0.008</text>
  <text x="890" y="136" class="cell">0.154</text>

  <rect x="24" y="158" width="932" height="52" fill="#fef2f2" stroke="#fecaca"/>
  <text x="38" y="188" class="cell">R2_FR01_even_slice</text>
  <text x="280" y="188" class="cell">collapse_like</text>
  <text x="430" y="188" class="cell">0.344</text>
  <text x="560" y="188" class="cell">0.068</text>
  <text x="740" y="188" class="cell">0.000</text>
  <text x="890" y="188" class="cell">0.160</text>

  <rect x="24" y="210" width="932" height="52" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="38" y="240" class="cell">R3_CT01_even_slice</text>
  <text x="280" y="240" class="cell">contamination_like</text>
  <text x="430" y="240" class="cell">0.176</text>
  <text x="560" y="240" class="cell">0.008</text>
  <text x="740" y="240" class="cell">0.056</text>
  <text x="890" y="240" class="cell">0.140</text>

  <rect x="24" y="262" width="932" height="52" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="38" y="292" class="cell">R4_CT01_odd_slice</text>
  <text x="280" y="292" class="cell">contamination_like</text>
  <text x="430" y="292" class="cell">0.172</text>
  <text x="560" y="292" class="cell">0.004</text>
  <text x="740" y="292" class="cell">0.036</text>
  <text x="890" y="292" class="cell">0.148</text>

  <rect x="24" y="332" width="932" height="62" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="38" y="354" class="note">Channel means: collapse_like collapse-rate=0.062 vs contamination_like=0.006 (about 10.3x).</text>
  <text x="38" y="372" class="note">Channel means: contamination_like high-confidence-wrong=0.046 vs collapse_like=0.004 (about 11.5x).</text>
  <text x="38" y="390" class="note">Neither-source stays close (0.157 vs 0.144), so rate-level novelty pressure alone does not identify channel.</text>
</svg>
