name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[hf,dev]"

    - name: Run linting
      run: |
        ruff check gradience/ tests/ --output-format=github

    - name: Run type checking
      run: |
        mypy gradience/ --ignore-missing-imports || echo "::warning::mypy found type errors (non-blocking)"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[hf,dev]"

    - name: Run unit tests
      run: |
        # pytest-cov can segfault during interpreter shutdown on GHA runners
        # (after all tests pass and coverage is written). Capture the real
        # test outcome from the output and tolerate SIGSEGV (139) only when
        # the summary line shows no failures.
        set +e
        pytest tests/ -v --tb=short --cov=gradience --cov-report=xml --cov-fail-under=65 2>&1 | tee pytest_output.txt
        rc=${PIPESTATUS[0]}
        set -e

        if [ $rc -eq 0 ]; then
          exit 0
        elif [ $rc -eq 139 ] && grep -qE ' passed' pytest_output.txt && ! grep -qE ' failed' pytest_output.txt; then
          echo "⚠️ pytest segfaulted during shutdown (exit 139) but all tests passed — treating as success"
          exit 0
        else
          echo "❌ Tests failed with exit code $rc"
          exit $rc
        fi

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      if: matrix.python-version == '3.11'
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  bench-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[bench,dev]"

    - name: Run CPU bench smoke test
      run: |
        python -m gradience.bench.run_bench \
          --config gradience/bench/configs/distilbert_sst2_ci.yaml \
          --output ci_smoke_test \
          --ci \
          --smoke

    - name: Validate bench artifacts
      run: |
        # Check that essential files were created
        test -f ci_smoke_test/bench.json || (echo "❌ bench.json not found" && exit 1)
        test -f ci_smoke_test/bench.md || (echo "❌ bench.md not found" && exit 1)

        # Validate JSON structure
        python -c "
        import json
        with open('ci_smoke_test/bench.json') as f:
            bench = json.load(f)

        # Check required keys (canonical bench.json schema)
        required_keys = ['bench_version', 'model', 'task', 'probe']
        for key in required_keys:
            assert key in bench, f'Missing key: {key}'

        # Check probe section
        assert 'accuracy' in bench['probe'], 'No accuracy in probe'

        # Check compressed variants (may be empty if probe undertrained in smoke)
        compressed = bench.get('compressed', {})

        print('✅ bench.json structure valid')
        print(f'   bench_version={bench[\"bench_version\"]}')
        print(f'   model={bench[\"model\"]}')
        print(f'   status={bench.get(\"status\", \"completed\")}')
        print(f'   compressed variants: {len(compressed)}')
        "

        echo "✅ CPU bench smoke test passed"

  lint-configs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install PyYAML
      run: pip install pyyaml

    - name: Validate YAML configs
      run: |
        python -c "
        import yaml
        from pathlib import Path

        configs_dir = Path('gradience/bench/configs')
        errors = []

        for yaml_file in configs_dir.rglob('*.yaml'):
            try:
                with open(yaml_file) as f:
                    config = yaml.safe_load(f)

                # Basic validation
                if not isinstance(config, dict):
                    errors.append(f'{yaml_file}: not a dict')
                    continue

                # Check required top-level keys for bench configs
                if yaml_file.parent.name != 'policies':  # Skip policy files
                    required_keys = ['model', 'task', 'train', 'lora']
                    for key in required_keys:
                        if key not in config:
                            errors.append(f'{yaml_file}: missing required key {key}')

                print(f'✅ {yaml_file.relative_to(configs_dir)}')

            except yaml.YAMLError as e:
                errors.append(f'{yaml_file}: YAML error - {e}')
            except Exception as e:
                errors.append(f'{yaml_file}: {e}')

        if errors:
            print(f'❌ Found {len(errors)} config validation errors:')
            for error in errors:
                print(f'  {error}')
            exit(1)
        else:
            print(f'✅ All {len(list(configs_dir.rglob(\"*.yaml\")))} config files valid')
        "
