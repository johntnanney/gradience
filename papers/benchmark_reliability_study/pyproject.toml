[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bench-reliability-study"
version = "0.1.0"
description = "Benchmark Accuracy as Measurement: CPU-side pipeline (SPEC_CPU_v0_2)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0,<7",
    "pandas>=2.1,<3",
    "pyarrow>=14,<17",
    "numpy>=1.26,<2",
    "scipy>=1.11,<2",
    "statsmodels>=0.14,<0.16",
    "jsonschema>=4.20,<5",
    "datasets>=2.14,<3",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9",
    "pytest-cov>=4.1,<6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gradience_study*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
