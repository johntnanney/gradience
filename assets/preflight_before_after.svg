<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');

      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 28px; fill: #1F2933; }
      .panel-header { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; font-size: 20px; fill: #1F2933; }
      .panel-sub { font-family: 'Inter', system-ui, sans-serif; font-weight: 400; font-size: 14px; fill: #738091; }
      .task-label { font-family: 'Inter', system-ui, sans-serif; font-weight: 500; font-size: 11px; fill: #52606D; }
      .adapter-label { font-family: 'Inter', system-ui, sans-serif; font-weight: 500; font-size: 10px; fill: #3E4C59; }
      .annotation { font-family: 'Inter', system-ui, sans-serif; font-weight: 500; font-size: 13px; fill: #52606D; }
      .annotation-small { font-family: 'Inter', system-ui, sans-serif; font-weight: 400; font-size: 12px; fill: #7B8794; }
      .center-label { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; font-size: 16px; fill: #3E4C59; }
      .center-sub { font-family: 'Inter', system-ui, sans-serif; font-weight: 400; font-size: 11px; fill: #9AA5B4; }
      .footer { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; font-size: 15px; fill: #3E4C59; }
      .zone-label { font-family: 'Inter', system-ui, sans-serif; font-weight: 500; font-size: 11px; letter-spacing: 0.05em; }
      .retained-label { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; font-size: 11px; fill: #2B6CB0; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="#FAFBFC"/>

  <!-- Title -->
  <text class="title" x="800" y="52" text-anchor="middle">Mixed-Task Inventory Preflight</text>

  <!-- ================================================================ -->
  <!-- LEFT PANEL — Before preflight -->
  <!-- ================================================================ -->
  <rect x="40" y="80" width="660" height="720" rx="12" fill="#FFFFFF" stroke="#E4E7EB" stroke-width="1"/>

  <text class="panel-header" x="370" y="118" text-anchor="middle">Before preflight</text>
  <text class="panel-sub" x="370" y="140" text-anchor="middle">Flat mixed-task candidate space</text>

  <!-- Task groups — 2x2 grid of task clusters -->
  <!-- QNLI group (top-left) -->
  <rect x="120" y="200" width="160" height="90" rx="8" fill="#F7FAFC" stroke="#E2E8F0" stroke-width="0.8"/>
  <text class="task-label" x="200" y="220" text-anchor="middle">QNLI</text>
  <circle cx="165" cy="258" r="18" fill="#E2E8F0" stroke="#CBD5E0" stroke-width="1"/>
  <text class="adapter-label" x="165" y="262" text-anchor="middle">s42</text>
  <circle cx="235" cy="258" r="18" fill="#E2E8F0" stroke="#CBD5E0" stroke-width="1"/>
  <text class="adapter-label" x="235" y="262" text-anchor="middle">s7</text>

  <!-- RTE group (top-right) -->
  <rect x="360" y="200" width="160" height="90" rx="8" fill="#F7FAFC" stroke="#E2E8F0" stroke-width="0.8"/>
  <text class="task-label" x="440" y="220" text-anchor="middle">RTE</text>
  <circle cx="405" cy="258" r="18" fill="#E2E8F0" stroke="#CBD5E0" stroke-width="1"/>
  <text class="adapter-label" x="405" y="262" text-anchor="middle">s42</text>
  <circle cx="475" cy="258" r="18" fill="#E2E8F0" stroke="#CBD5E0" stroke-width="1"/>
  <text class="adapter-label" x="475" y="262" text-anchor="middle">s7</text>

  <!-- MRPC group (bottom-left) -->
  <rect x="120" y="380" width="160" height="90" rx="8" fill="#F7FAFC" stroke="#E2E8F0" stroke-width="0.8"/>
  <text class="task-label" x="200" y="400" text-anchor="middle">MRPC</text>
  <circle cx="165" cy="438" r="18" fill="#E2E8F0" stroke="#CBD5E0" stroke-width="1"/>
  <text class="adapter-label" x="165" y="442" text-anchor="middle">s42</text>
  <circle cx="235" cy="438" r="18" fill="#E2E8F0" stroke="#CBD5E0" stroke-width="1"/>
  <text class="adapter-label" x="235" y="442" text-anchor="middle">s7</text>

  <!-- SST-2 group (bottom-right) -->
  <rect x="360" y="380" width="160" height="90" rx="8" fill="#F7FAFC" stroke="#E2E8F0" stroke-width="0.8"/>
  <text class="task-label" x="440" y="400" text-anchor="middle">SST-2</text>
  <circle cx="405" cy="438" r="18" fill="#E2E8F0" stroke="#CBD5E0" stroke-width="1"/>
  <text class="adapter-label" x="405" y="442" text-anchor="middle">s42</text>
  <circle cx="475" cy="438" r="18" fill="#E2E8F0" stroke="#CBD5E0" stroke-width="1"/>
  <text class="adapter-label" x="475" y="442" text-anchor="middle">s7</text>

