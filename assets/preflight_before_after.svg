  <!-- QNLI-RTE connections -->
  <line x1="235" y1="258" x2="405" y2="258" stroke="#CBD5E0" stroke-width="0.7" opacity="0.5"/>
  <line x1="165" y1="258" x2="475" y2="258" stroke="#CBD5E0" stroke-width="0.7" opacity="0.5"/>
  <line x1="165" y1="258" x2="405" y2="258" stroke="#CBD5E0" stroke-width="0.7" opacity="0.5"/>
  <line x1="235" y1="258" x2="475" y2="258" stroke="#CBD5E0" stroke-width="0.7" opacity="0.5"/>

  <!-- QNLI-MRPC connections -->
  <line x1="165" y1="276" x2="165" y2="420" stroke="#CBD5E0" stroke-width="0.7" opacity="0.5"/>
  <line x1="235" y1="276" x2="235" y2="420" stroke="#CBD5E0" stroke-width="0.7" opacity="0.5"/>
  <line x1="165" y1="276" x2="235" y2="420" stroke="#CBD5E0" stroke-width="0.7" opacity="0.5"/>
  <line x1="235" y1="276" x2="165" y2="420" stroke="#CBD5E0" stroke-width="0.7" opacity="0.5"/>

  <!-- QNLI-SST2 connections -->
  <line x1="165" y1="276" x2="405" y2="420" stroke="#CBD5E0" stroke-width="0.7" opacity="0.5"/>
  <line x1="235" y1="276" x2="475" y2="420" stroke="#CBD5E0" stroke-width="0.7" opacity="0.5"/>
  <line x1="165" y1="276" x2="475" y2="420" stroke="#CBD5E0" stroke-width="0.7" opacity="0.5"/>
  <line x1="235" y1="276" x2="405" y2="420" stroke="#CBD5E0" stroke-width="0.7" opacity="0.5"/>

  <!-- RTE-MRPC connections -->
  <line x1="405" y1="276" x2="165" y2="420" stroke="#CBD5E0" stroke-width="0.7" opacity="0.5"/>
  <line x1="475" y1="276" x2="235" y2="420" stroke="#CBD5E0" stroke-width="0.7" opacity="0.5"/>
  <line x1="405" y1="276" x2="235" y2="420" stroke="#CBD5E0" stroke-width="0.7" opacity="0.5"/>
  <line x1="475" y1="276" x2="165" y2="420" stroke="#CBD5E0" stroke-width="0.7" opacity="0.5"/>

  <!-- RTE-SST2 connections -->
  <line x1="405" y1="276" x2="405" y2="420" stroke="#CBD5E0" stroke-width="0.7" opacity="0.5"/>
  <line x1="475" y1="276" x2="475" y2="420" stroke="#CBD5E0" stroke-width="0.7" opacity="0.5"/>
  <line x1="405" y1="276" x2="475" y2="420" stroke="#CBD5E0" stroke-width="0.7" opacity="0.5"/>
  <line x1="475" y1="276" x2="405" y2="420" stroke="#CBD5E0" stroke-width="0.7" opacity="0.5"/>

  <!-- MRPC-SST2 connections -->
  <line x1="235" y1="438" x2="405" y2="438" stroke="#CBD5E0" stroke-width="0.7" opacity="0.5"/>
  <line x1="165" y1="438" x2="475" y2="438" stroke="#CBD5E0" stroke-width="0.7" opacity="0.5"/>
  <line x1="165" y1="438" x2="405" y2="438" stroke="#CBD5E0" stroke-width="0.7" opacity="0.5"/>
  <line x1="235" y1="438" x2="475" y2="438" stroke="#CBD5E0" stroke-width="0.7" opacity="0.5"/>

