<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');

      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 22px; fill: #1F2933; }
      .subtitle { font-family: 'Inter', system-ui, sans-serif; font-weight: 400; font-size: 13px; fill: #7B8794; }
      .stage-label { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; font-size: 13px; fill: #1F2933; }
      .stage-detail { font-family: 'Inter', system-ui, sans-serif; font-weight: 400; font-size: 11px; fill: #52606D; }
      .stage-num { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 11px; fill: #FFFFFF; }
      .output-label { font-family: 'Inter', system-ui, sans-serif; font-weight: 500; font-size: 10px; fill: #5A67D8; }
      .filter-label { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; font-size: 11px; fill: #9B2C2C; }
      .filter-detail { font-family: 'Inter', system-ui, sans-serif; font-weight: 400; font-size: 10px; fill: #9B2C2C; }
      .result-label { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; font-size: 14px; }
      .result-detail { font-family: 'Inter', system-ui, sans-serif; font-weight: 400; font-size: 11px; fill: #52606D; }
      .footer { font-family: 'Inter', system-ui, sans-serif; font-weight: 400; font-size: 10px; fill: #9AA5B4; }
    </style>

    <marker id="arr" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#9AA5B4"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#E53E3E"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="#FAFBFC"/>

  <!-- Title -->
  <text class="title" x="450" y="38" text-anchor="middle">Gradience Preflight Pipeline</text>
  <text class="subtitle" x="450" y="58" text-anchor="middle">From adapter pool to evaluated merge candidates</text>

  <!-- ================================================================ -->
  <!-- INPUT: Adapter Pool -->
  <!-- ================================================================ -->
  <rect x="30" y="90" width="130" height="80" rx="8" fill="#EDF2F7" stroke="#CBD5E0" stroke-width="1"/>
  <text class="stage-label" x="95" y="118" text-anchor="middle">Adapter Pool</text>
  <text class="stage-detail" x="95" y="136" text-anchor="middle">n adapters</text>
  <text class="stage-detail" x="95" y="150" text-anchor="middle">n(n-1)/2 pairs</text>

  <!-- Arrow to Stage 1 -->
  <line x1="160" y1="130" x2="188" y2="130" stroke="#9AA5B4" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ================================================================ -->
  <!-- STAGE 1: Spectral Audit -->
  <!-- ================================================================ -->
  <rect x="196" y="90" width="140" height="80" rx="8" fill="#FFFFFF" stroke="#3182CE" stroke-width="1.5"/>
  <rect x="205" y="98" width="18" height="18" rx="9" fill="#3182CE"/>
  <text class="stage-num" x="214" y="112" text-anchor="middle">1</text>
  <text class="stage-label" x="275" y="112" text-anchor="middle">Spectral Audit</text>
  <text class="stage-detail" x="266" y="130" text-anchor="middle">Per-layer SVD:</text>
  <text class="stage-detail" x="266" y="144" text-anchor="middle">stable rank, energy,</text>
  <text class="stage-detail" x="266" y="158" text-anchor="middle">utilization ratio</text>

  <!-- Arrow to Stage 2 -->
  <line x1="336" y1="130" x2="364" y2="130" stroke="#9AA5B4" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ================================================================ -->
  <!-- STAGE 2: Evidence Gate -->
  <!-- ================================================================ -->
  <rect x="372" y="82" width="150" height="96" rx="8" fill="#FFFFFF" stroke="#E53E3E" stroke-width="1.5"/>
  <rect x="381" y="90" width="18" height="18" rx="9" fill="#E53E3E"/>
  <text class="stage-num" x="390" y="104" text-anchor="middle">2</text>
  <text class="stage-label" x="456" y="104" text-anchor="middle">Evidence Gate</text>
  <text class="stage-detail" x="447" y="122" text-anchor="middle">Eval vs base model</text>
  <text class="stage-detail" x="447" y="136" text-anchor="middle">(500 examples, CPU)</text>

  <!-- QA classification outputs -->
  <text class="output-label" x="447" y="155" text-anchor="middle">eligible | uncertain</text>
  <text class="output-label" x="447" y="168" text-anchor="middle">flagged_weak | unknown</text>

  <!-- Filter-out arrow (downward) -->
  <line x1="447" y1="178" x2="447" y2="220" stroke="#E53E3E" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <rect x="380" y="224" width="134" height="36" rx="6" fill="#FFF5F5" stroke="#FED7D7" stroke-width="1"/>
  <text class="filter-label" x="447" y="240" text-anchor="middle">Excluded</text>
  <text class="filter-detail" x="447" y="253" text-anchor="middle">weak + unknown adapters</text>

  <!-- Arrow to Stage 3 -->
  <line x1="522" y1="130" x2="550" y2="130" stroke="#9AA5B4" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ================================================================ -->
  <!-- STAGE 3: Pairwise Compatibility -->
  <!-- ================================================================ -->
  <rect x="558" y="82" width="150" height="96" rx="8" fill="#FFFFFF" stroke="#3182CE" stroke-width="1.5"/>
  <rect x="567" y="90" width="18" height="18" rx="9" fill="#3182CE"/>
  <text class="stage-num" x="576" y="104" text-anchor="middle">3</text>
  <text class="stage-label" x="642" y="104" text-anchor="middle">Pairwise Audit</text>
  <text class="stage-detail" x="633" y="122" text-anchor="middle">Principal angles,</text>
  <text class="stage-detail" x="633" y="136" text-anchor="middle">directional agreement,</text>
  <text class="stage-detail" x="633" y="150" text-anchor="middle">per-layer verdicts</text>
  <text class="output-label" x="633" y="168" text-anchor="middle">+ task-boundary detection</text>

  <!-- Arrow to Stage 4 -->
  <line x1="708" y1="130" x2="736" y2="130" stroke="#9AA5B4" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ================================================================ -->
  <!-- STAGE 4: Action Plan -->
  <!-- ================================================================ -->
  <rect x="744" y="90" width="130" height="80" rx="8" fill="#FFFFFF" stroke="#3182CE" stroke-width="1.5"/>
  <rect x="753" y="98" width="18" height="18" rx="9" fill="#3182CE"/>
  <text class="stage-num" x="762" y="112" text-anchor="middle">4</text>
  <text class="stage-label" x="818" y="112" text-anchor="middle">Action Plan</text>
  <text class="stage-detail" x="809" y="130" text-anchor="middle">Retained / Near-miss</text>
  <text class="stage-detail" x="809" y="144" text-anchor="middle">/ Skip triage</text>
  <text class="stage-detail" x="809" y="158" text-anchor="middle">+ strategy recs</text>

  <!-- ================================================================ -->
  <!-- OUTPUT: Three categories -->
  <!-- ================================================================ -->

  <!-- Arrow down from Action Plan to outputs -->
  <line x1="809" y1="170" x2="809" y2="210" stroke="#9AA5B4" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Retained box -->
  <rect x="580" y="218" width="140" height="72" rx="8" fill="#F0FFF4" stroke="#C6F6D5" stroke-width="1"/>
  <text class="result-label" x="650" y="240" text-anchor="middle" fill="#276749">Retained</text>
  <text class="result-detail" x="650" y="258" text-anchor="middle">Pursue for evaluation</text>
  <text class="result-detail" x="650" y="272" text-anchor="middle">Typically 7-10% of pool</text>
  <text class="result-detail" x="650" y="284" text-anchor="middle">29% improve over best source</text>

  <!-- Near-miss box -->
  <rect x="730" y="218" width="140" height="72" rx="8" fill="#FEFCBF" stroke="#F6E05E" stroke-width="1"/>
  <text class="result-label" x="800" y="240" text-anchor="middle" fill="#975A16">Near-miss</text>
  <text class="result-detail" x="800" y="258" text-anchor="middle">Fix evidence, then retry</text>
  <text class="result-detail" x="800" y="272" text-anchor="middle">Ranked: marginal /</text>
  <text class="result-detail" x="800" y="284" text-anchor="middle">moderate / substantial</text>

  <!-- Skip box (below excluded, offset) -->
  <rect x="380" y="275" width="134" height="42" rx="6" fill="#EDF2F7" stroke="#CBD5E0" stroke-width="1"/>
  <text class="result-label" x="447" y="295" text-anchor="middle" fill="#718096">Skip</text>
  <text class="result-detail" x="447" y="310" text-anchor="middle">Cross-task or incompatible</text>

  <!-- ================================================================ -->
  <!-- EXAMPLE: concrete numbers -->
  <!-- ================================================================ -->
  <rect x="60" y="340" width="810" height="110" rx="10" fill="#FFFFFF" stroke="#E4E7EB" stroke-width="1"/>
  <text class="stage-label" x="80" y="365">Example: Large mixed-task inventory</text>

  <!-- Flow illustration -->
  <rect x="80" y="380" width="80" height="44" rx="6" fill="#EDF2F7" stroke="#CBD5E0" stroke-width="0.8"/>
  <text class="stage-detail" x="120" y="400" text-anchor="middle">9 adapters</text>
  <text class="stage-detail" x="120" y="414" text-anchor="middle">28 pairs</text>

  <line x1="160" y1="402" x2="195" y2="402" stroke="#9AA5B4" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="200" y="380" width="110" height="44" rx="6" fill="#FFFFFF" stroke="#3182CE" stroke-width="0.8"/>
  <text class="stage-detail" x="255" y="400" text-anchor="middle">Spectral audit</text>
  <text class="stage-detail" x="255" y="414" text-anchor="middle">all 9 adapters</text>

  <line x1="310" y1="402" x2="345" y2="402" stroke="#9AA5B4" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="350" y="380" width="110" height="44" rx="6" fill="#FFF5F5" stroke="#E53E3E" stroke-width="0.8"/>
  <text class="stage-detail" x="405" y="400" text-anchor="middle">Evidence gate</text>
  <text class="filter-detail" x="405" y="414" text-anchor="middle">1 adapter excluded</text>

  <line x1="460" y1="402" x2="495" y2="402" stroke="#9AA5B4" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="500" y="380" width="110" height="44" rx="6" fill="#FFFFFF" stroke="#3182CE" stroke-width="0.8"/>
  <text class="stage-detail" x="555" y="400" text-anchor="middle">Pairwise audit</text>
  <text class="stage-detail" x="555" y="414" text-anchor="middle">28 pairs analyzed</text>

  <line x1="610" y1="402" x2="645" y2="402" stroke="#9AA5B4" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="650" y="380" width="90" height="44" rx="6" fill="#F0FFF4" stroke="#C6F6D5" stroke-width="1"/>
  <text class="result-label" x="695" y="400" text-anchor="middle" fill="#276749">2 retained</text>
  <text class="stage-detail" x="695" y="414" text-anchor="middle">93% reduction</text>

  <rect x="750" y="380" width="100" height="44" rx="6" fill="#EDF2F7" stroke="#CBD5E0" stroke-width="0.8"/>
  <text class="stage-detail" x="800" y="400" text-anchor="middle">26 skipped</text>
  <text class="stage-detail" x="800" y="414" text-anchor="middle">+ near-misses</text>

  <!-- Footer -->
  <text class="footer" x="450" y="480" text-anchor="middle">Validated across 5 inventories, 3 backbones, 53+ pairs. Zero false positives on task-boundary detection.</text>
</svg>
