site_name: Gradience
site_description: Spectral analysis of low-rank adaptation dynamics
site_url: https://johntnanney.github.io/gradience
repo_url: https://github.com/johntnanney/gradience
repo_name: johntnanney/gradience

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

# Legacy docs contain broken relative links; exclude them from strict validation.
# New documentation (getting-started/, guide/, api/, architecture/, research/,
# contributing/) should remain free of warnings.
strict: false
validation:
  links:
    not_found: info

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - toc:
      permalink: true
  - attr_list
  - def_list
  - tables

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/johntnanney/gradience
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/gradience/

nav:
  - Home: index.md
  - Getting Started:
    - getting-started/index.md
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - HuggingFace Integration: getting-started/huggingface.md
  - User Guide:
    - guide/index.md
    - CLI Reference: guide/cli.md
    - Configuration: guide/configuration.md
    - Artifacts & Output: guide/artifacts.md
    - Storage & Caching: guide/storage.md
    - Troubleshooting: guide/troubleshooting.md
  - API Reference:
    - api/index.md
    - Python API (gradience.api): api/python-api.md
    - Spectral Audit: api/audit.md
    - Merge Audit: api/merge.md
    - Telemetry: api/telemetry.md
    - Rank Suggestion: api/rank-suggestion.md
    - Types & Data Model: api/types.md
    - Exceptions: api/exceptions.md
    - API Stability Policy: api/stability.md
  - Architecture:
    - architecture/index.md
    - Design Principles: architecture/design.md
    - Module Map: architecture/modules.md
  - Research:
    - research/index.md
    - Theory & Math: research/theory.md
    - Empirical Findings: research/findings.md
    - Rank Policies: research/rank-policies.md
    - Validation Policy: research/validation.md
  - Contributing:
    - contributing/index.md
    - Development Setup: contributing/development.md
    - CI & Testing: contributing/ci.md
  - Changelog: changelog.md
