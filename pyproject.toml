[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gradience"
version = "1.0.1"
description = "Spectral analysis of low-rank adaptation dynamics — measure rank evolution, detect phase transitions, and study training geometry"
readme = "README_PYPI.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    {name = "John Nanney", email = "johntnanney@gmail.com"}
]
keywords = ["lora", "spectral-analysis", "training-dynamics", "low-rank-adaptation", "fine-tuning", "merge-audit", "adapter-merge", "compression", "model-compression"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
    "Typing :: Typed",
]
dependencies = [
  "pyyaml>=6.0",     # For parsing config files
  "numpy>=1.24.0",   # Core numerical operations (lightweight)
  "packaging",       # For version parsing and compatibility
  "rich>=10.0.0",    # Pretty CLI output and progress bars
  "scipy>=1.7.0",
  "torch>=2.0.0",    # Core: spectral audit, merge-audit, LoRA weight math
  "safetensors>=0.4.0",  # Core: safe model weight loading
  "typing_extensions>=4.0.0; python_version < '3.11'",  # NotRequired for TypedDicts
]

[project.urls]
Homepage = "https://github.com/johntnanney/gradience"
Repository = "https://github.com/johntnanney/gradience"
Documentation = "https://github.com/johntnanney/gradience#readme"
"Bug Tracker" = "https://github.com/johntnanney/gradience/issues"

[project.optional-dependencies]
# Benchmarking suite - for running compression validation benchmarks
# Install with: pip install "gradience[bench]"
bench = [
  "transformers>=4.35.0,<6",
  "peft>=0.7.0,<1",
  "datasets>=2.14.0",
  "accelerate>=0.20.0",
  "evaluate>=0.4.0",         # For benchmark metrics
  "sentencepiece>=0.1.99",
  "protobuf>=3.20.0",
  "scikit-learn>=1.3.0",     # For metrics
  "pandas>=2.0.0",           # For data analysis
  "huggingface_hub>=0.20.0", # For adapter discovery and downloading
]

# Hugging Face integration only (lighter than full bench)
# Install with: pip install "gradience[hf]"
hf = [
  "transformers>=4.35.0,<6",
  "peft>=0.7.0,<1",
  "sentencepiece>=0.1.99",   # For tokenizers
  "protobuf>=3.20.0",        # For tokenizers
]

# Development tools - for contributors
# Install with: pip install gradience[dev]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",     # Coverage reporting
  "pytest-timeout>=2.2.0", # Test timeouts
  "build>=0.10.0",         # Package building
  "ruff>=0.1.0",           # Linting and formatting
  "mypy>=1.5.0",           # Type checking
  "pre-commit>=3.0.0",     # Git hooks
  "twine>=4.0.0",          # Package publishing
]

# Fast downloading (optional performance enhancement)
# Install with: pip install gradience[fast]
fast = [
  "hf_transfer>=0.1.4",    # Faster HuggingFace downloads
]

# All optional dependencies for full functionality
# Install with: pip install "gradience[all]"
all = [
  "gradience[bench,hf,dev,fast]",
]

[project.scripts]
gradience = "gradience.cli:main"
gradience-bench = "gradience.bench.run_bench:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gradience*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"gradience.bench.configs" = ["*.yaml", "**/*.yaml"]
"gradience.bench.policies" = ["*.yaml", "**/*.yaml"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["scripts/one_liner_inspect.py"]  # Shell heredoc, not valid Python

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B905",   # zip without strict (Python 3.10 compat)
    "SIM108", # ternary operator (readability preference)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM300"]
"scripts/*" = ["E402", "E741"]  # E402: deferred imports, E741: `l` for layer in research scripts
"dev/*" = ["E741", "E722", "F821"]  # Legacy dev scripts; F821: some use undefined repo_root
"examples/*" = ["B904"]  # raise-without-from in example scripts (readability)
"docs/legacy/*" = ["E402", "E722", "SIM102", "SIM115", "B018"]  # Legacy code, not actively maintained
"scripts/one_liner_inspect.py" = ["E701", "W291", "W292"]  # Shell heredoc, not valid Python

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["tests/", "scripts/", "dev/", "docs/"]

[[tool.mypy.overrides]]
module = [
    "transformers.*",
    "peft.*",
    "datasets.*",
    "accelerate.*",
    "evaluate.*",
    "pandas.*",
    "sklearn.*",
    "safetensors.*",
    "yaml.*",
    "psutil.*",
    "importlib_metadata.*",
    "gradience.verify",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "error::DeprecationWarning",
    "ignore::DeprecationWarning:gradience",
    "ignore:datetime.datetime.utcnow:DeprecationWarning",
]
timeout = 30
