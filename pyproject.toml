[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gradience"
version = "0.9.0"
description = "Audit-driven LoRA compression with transparent decision traces and statistical validation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    {name = "John Nanney", email = "john@example.com"}
]
keywords = ["lora", "compression", "audit", "neural-networks", "fine-tuning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "pyyaml",          # For parsing config files
  "numpy>=1.20.0",   # Core numerical operations (lightweight)
  "packaging",       # For version parsing and compatibility
  "rich>=10.0.0",    # Pretty CLI output and progress bars
]

[project.urls]
Homepage = "https://github.com/johntnanney/gradience"
Repository = "https://github.com/johntnanney/gradience"
Documentation = "https://github.com/johntnanney/gradience#readme"
"Bug Tracker" = "https://github.com/johntnanney/gradience/issues"

[project.optional-dependencies]
# Benchmarking suite - for running compression validation benchmarks
# NOTE: Install PyTorch separately first: https://pytorch.org/get-started/
# Then: pip install gradience[bench]
bench = [
  "transformers>=4.35.0",
  "peft>=0.7.0", 
  "datasets>=2.14.0",
  "safetensors>=0.4.0",
  "accelerate>=0.20.0",
  "sentencepiece>=0.1.99",
  "protobuf>=3.20.0",
  "scikit-learn>=1.3.0",   # For metrics
  "pandas>=2.0.0",         # For data analysis
]

# Hugging Face integration only (lighter than full bench)
# NOTE: Install PyTorch separately first: https://pytorch.org/get-started/
# Then: pip install gradience[hf]
hf = [
  "transformers>=4.35.0",
  "peft>=0.7.0",
  "safetensors>=0.4.0",
  "sentencepiece>=0.1.99",  # For tokenizers
  "protobuf>=3.20.0",       # For tokenizers
]

# Development tools - for contributors
# Install with: pip install gradience[dev]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",     # Coverage reporting
  "build>=0.10.0",         # Package building
  "ruff>=0.1.0",           # Linting and formatting
  "mypy>=1.5.0",           # Type checking
  "pre-commit>=3.0.0",     # Git hooks
  "twine>=4.0.0",          # Package publishing
]

# Fast downloading (optional performance enhancement)
# Install with: pip install gradience[fast]
fast = [
  "hf_transfer>=0.1.4",    # Faster HuggingFace downloads
]

# All optional dependencies for full functionality
# NOTE: Install PyTorch separately first: https://pytorch.org/get-started/
# Then: pip install gradience[all]
all = [
  "transformers>=4.35.0",
  "peft>=0.7.0",
  "datasets>=2.14.0", 
  "accelerate>=0.20.0",
  "safetensors>=0.4.0",
  "sentencepiece>=0.1.99",
  "protobuf>=3.20.0",
  "scikit-learn>=1.3.0",
  "pandas>=2.0.0",
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "build>=0.10.0",
  "ruff>=0.1.0",
  "mypy>=1.5.0",
  "pre-commit>=3.0.0",
  "twine>=4.0.0",
  "hf_transfer>=0.1.4",
]

[project.scripts]
gradience = "gradience.cli:main"
gradience-bench = "gradience.bench.run_bench:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gradience*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"gradience.bench.configs" = ["*.yaml", "**/*.yaml"]
"gradience.bench.policies" = ["*.yaml", "**/*.yaml"]
